networks:
  podweaver_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

  lighthouse_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
          gateway: 10.20.0.254