services:

  lighthouse:
    build: .
    image: podweaver:latest
    container_name: lighthouse-1
    entrypoint: ["lighthouse"]
    command: ["0.0.0.0:9001"]
    networks:
      lighthouse_net:
        ipv4_address: 10.20.0.1
    volumes:
      - $HOME/tmp/shared:/shared
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9001' || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 1s

  pod1:
    image: podweaver:latest
    container_name: podweaver-pod1
    depends_on:
      lighthouse: { condition: service_healthy }
    environment:
      - PODWEAVER_HOME=/data
    networks:
      podweaver_net:
        ipv4_address: 172.31.0.101
      lighthouse_net:
    volumes:
      - $HOME/tmp/shared:/shared
      - $HOME/tmp/podweaver/pod1:/data
    command: idle
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/20001' || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 1s

  pod2:
    image: podweaver:latest
    container_name: podweaver-pod2
    depends_on:
      pod1: { condition: service_healthy }
    environment:
      - PODWEAVER_HOME=/data
    networks:
      podweaver_net:
        ipv4_address: 172.31.0.102
      lighthouse_net:
    volumes:
      - $HOME/tmp/shared:/shared
      - $HOME/tmp/podweaver/pod2:/data
    command: seed /shared/test.bin
    healthcheck:
      test: ["CMD-SHELL", "test -f /shared/test.bin.yarn && bash -c 'exec 3<>/dev/tcp/127.0.0.1/20001' || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 1s

  pod3:
    image: podweaver:latest
    container_name: podweaver-pod3
    depends_on:
      pod2: { condition: service_healthy }
    environment:
      - PODWEAVER_HOME=/data
    networks:
      podweaver_net:
        ipv4_address: 172.31.0.103
      lighthouse_net:
    volumes:
      - $HOME/tmp/shared:/shared
      - $HOME/tmp/podweaver/pod3:/data
    command: download /shared/test.bin.yarn /shared/test3.out

  pod4:
    image: podweaver:latest
    container_name: podweaver-pod4
    depends_on:
      pod2: { condition: service_healthy }
    environment:
      - PODWEAVER_HOME=/data
