services:

  lighthouse:
    build: .
    image: podweaver:latest
    container_name: lighthouse-1
    entrypoint: ["lighthouse"]
    command: ["0.0.0.0:9001"]
    networks:
      podweaver_net:
        ipv4_address: 10.99.0.2
    volumes:
      - $HOME/tmp/shared:/shared
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9001' || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 1s

  pod1:
    image: podweaver:latest
    container_name: podweaver-pod1
    entrypoint: ["podweaver-ui"]
    depends_on:
      lighthouse: { condition: service_healthy }
    environment:
      - PODWEAVER_HOME=/data
      - LIGHTHOUSE_ADDR=10.99.0.2:9001
      - UI_PORT=8080
      - DOWNLOAD_RATE=500000
    networks:
      podweaver_net:
        ipv4_address: 10.99.0.3
    volumes:
      - $HOME/tmp/shared:/shared
      - $HOME/tmp/podweaver/pod1:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/20001' || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 1s
    ports:
      - "8081:8080"

  pod2:
    image: podweaver:latest
    container_name: podweaver-pod2
    entrypoint: ["podweaver-ui"]
    depends_on:
      pod1: { condition: service_healthy }
    environment:
      - PODWEAVER_HOME=/data
      - LIGHTHOUSE_ADDR=10.99.0.2:9001
      - UI_PORT=8080
      - DOWNLOAD_RATE=500000
    networks:
      podweaver_net:
        ipv4_address: 10.99.0.4
    volumes:
      - $HOME/tmp/shared:/shared
      - $HOME/tmp/podweaver/pod2:/data
    ports:
      - "8082:8080"

  pod3:
    image: podweaver:latest
    container_name: podweaver-pod3
    entrypoint: ["podweaver-ui"]
    depends_on:
      pod1: { condition: service_healthy }
    environment:
      - PODWEAVER_HOME=/data
      - LIGHTHOUSE_ADDR=10.99.0.2:9001
      - UI_PORT=8080
      - DOWNLOAD_RATE=500000
    networks:
      podweaver_net:
        ipv4_address: 10.99.0.5
    volumes:
      - $HOME/tmp/shared:/shared
      - $HOME/tmp/podweaver/pod3:/data
    ports:
      - "8083:8080"

  pod4:
    image: podweaver:latest
    container_name: podweaver-pod4
    entrypoint: ["podweaver-ui"]
    depends_on:
      pod1: { condition: service_healthy }
    environment:
      - PODWEAVER_HOME=/data
      - LIGHTHOUSE_ADDR=10.99.0.2:9001
      - UI_PORT=8080
      - DOWNLOAD_RATE=500000
    networks:
      podweaver_net:
        ipv4_address: 10.99.0.6
    volumes:
      - $HOME/tmp/shared:/shared
      - $HOME/tmp/podweaver/pod4:/data
    ports:
      - "8084:8080"

  pod5:
    image: podweaver:latest
    container_name: podweaver-pod5
    entrypoint: ["podweaver-ui"]
    depends_on:
      pod1: { condition: service_healthy }
    environment:
      - PODWEAVER_HOME=/data
      - LIGHTHOUSE_ADDR=10.99.0.2:9001
      - UI_PORT=8080
      - DOWNLOAD_RATE=500000
    networks:
      podweaver_net:
        ipv4_address: 10.99.0.7
    volumes:
      - $HOME/tmp/shared:/shared
      - $HOME/tmp/podweaver/pod5:/data
    ports:
      - "8085:8080"

networks:
  podweaver_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24